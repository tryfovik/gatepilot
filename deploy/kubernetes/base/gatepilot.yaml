apiVersion: v1
kind: Namespace
metadata:
  name: gatepilot-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatepilot
  namespace: gatepilot-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatepilot-apiserver-config
  namespace: gatepilot-system
data:
  application.yaml: |
    server:
      port: 18080
    spring:
      application:
        name: gatepilot-apiserver
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          probes:
            enabled: true
    getboot:
      lock:
        enabled: true
      observability:
        trace:
          enabled: true
          header-name: X-Trace-Id
          request-header-propagation-enabled: true
          response-header-enabled: true
          mdc-key: traceId
        metrics:
          enabled: true
          common-tags:
            app: gatepilot-apiserver
            env: prod
        prometheus:
          enabled: true
    gatepilot:
      mode: standalone
      apiserver:
        enabled: true
        store:
          type: database
          database:
            initialize-schema: false
      controller-manager:
        enabled: true
      agent:
        enabled: false
      proxy:
        enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatepilot-proxy-config
  namespace: gatepilot-system
data:
  application.yaml: |
    server:
      port: 18081
    spring:
      application:
        name: gatepilot-proxy
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          probes:
            enabled: true
    getboot:
      observability:
        trace:
          enabled: true
          header-name: X-Trace-Id
          request-header-propagation-enabled: true
          response-header-enabled: true
          mdc-key: traceId
        metrics:
          enabled: true
          common-tags:
            app: gatepilot-proxy
            env: prod
        prometheus:
          enabled: true
    gatepilot:
      mode: cluster
      apiserver:
        enabled: false
      controller-manager:
        enabled: false
      agent:
        enabled: true
        apiserver-base-url: http://gatepilot-apiserver.gatepilot-system.svc.cluster.local:18080
        proxy-base-url: http://127.0.0.1:18081
        namespace: default
        role: PROXY
        config-shards:
          - shard-a
        local-config:
          store-type: file
          directory: /var/lib/gatepilot/agent/local-config
      proxy:
        enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatepilot-apiserver
  namespace: gatepilot-system
  labels:
    app.kubernetes.io/name: gatepilot
    app.kubernetes.io/component: apiserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gatepilot
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatepilot
        app.kubernetes.io/component: apiserver
    spec:
      serviceAccountName: gatepilot
      containers:
        - name: apiserver
          image: gatepilot-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18080
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/gatepilot/application.yaml
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: gatepilot-database
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gatepilot-database
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatepilot-database
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/gatepilot
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: gatepilot-apiserver-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatepilot-apiserver
  namespace: gatepilot-system
  labels:
    app.kubernetes.io/name: gatepilot
    app.kubernetes.io/component: apiserver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gatepilot
    app.kubernetes.io/component: apiserver
  ports:
    - name: http
      port: 18080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatepilot-proxy
  namespace: gatepilot-system
  labels:
    app.kubernetes.io/name: gatepilot
    app.kubernetes.io/component: proxy
    gatepilot.dt.com/config-shard: shard-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gatepilot
      app.kubernetes.io/component: proxy
      gatepilot.dt.com/config-shard: shard-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatepilot
        app.kubernetes.io/component: proxy
        gatepilot.dt.com/config-shard: shard-a
    spec:
      serviceAccountName: gatepilot
      containers:
        - name: proxy
          image: gatepilot-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18081
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/gatepilot/application.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GATEPILOT_AGENT_NODE_ID
              value: $(POD_NAME)
            - name: GATEPILOT_AGENT_ADDRESS
              value: $(POD_IP)
          volumeMounts:
            - name: config
              mountPath: /etc/gatepilot
              readOnly: true
            - name: local-config
              mountPath: /var/lib/gatepilot/agent/local-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: gatepilot-proxy-config
        - name: local-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gatepilot-proxy
  namespace: gatepilot-system
  labels:
    app.kubernetes.io/name: gatepilot
    app.kubernetes.io/component: proxy
    gatepilot.dt.com/config-shard: shard-a
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gatepilot
    app.kubernetes.io/component: proxy
    gatepilot.dt.com/config-shard: shard-a
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gatepilot-proxy
  namespace: gatepilot-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gatepilot-proxy
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gatepilot-proxy
  namespace: gatepilot-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gatepilot
      app.kubernetes.io/component: proxy
      gatepilot.dt.com/config-shard: shard-a
