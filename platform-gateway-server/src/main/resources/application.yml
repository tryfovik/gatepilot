spring:
  profiles:
    active: @profileActive@
  application:
    name: platform-gateway

server:
  port: 18082

getboot:
  observability:
    trace:
      enabled: true
    metrics:
      enabled: true
      common-tags:
        app: platform-gateway
        env: local
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus,platformGatewayRoutes
      endpoint:
        health:
          show-details: always
          show-components: always
          probes:
            enabled: true
      health:
        livenessstate:
          enabled: true
        readinessstate:
          enabled: true
        ping:
          enabled: true
        redis:
          enabled: false
  auth:
    satoken:
      is-log: false
      token-name: Authorization
  governance:
    enabled: false
    sentinel:
      enabled: false
      gateway:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"status":"fail","code":429,"message":"Too many requests"}'
          content-type: application/json;charset=UTF-8

platform:
  gateway:
    api-prefix: /api
    internal-prefix: /internal
    auth:
      enabled: true
      skip-options-request: true
      unauthorized-message: Unauthorized
      forbidden-message: Forbidden
    cors:
      enabled: true
      allowed-origin-patterns:
        - http://127.0.0.1:*
        - http://localhost:*
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      exposed-headers:
        - X-Trace-Id
        - Authorization
      allow-credentials: true
      max-age: 1h
    context-headers:
      enabled: true
      project-header-name: X-Platform-Project
      route-header-name: X-Platform-Route
    projects:
      game:
        enabled: true
        path-segment: game
        display-name: Game Platform
        routes:
          admin:
            enabled: true
            api-enabled: true
            actuator-enabled: true
            path-segment: admin
            service-uri: http://127.0.0.1:18080
            # api-methods:
            #   - GET
            #   - POST
            # api-max-request-size: 10MB
            service-path-prefix: /admin
            actuator-uri: http://127.0.0.1:18080
            # internal-methods:
            #   - GET
            # internal-max-request-size: 1MB
            connect-timeout-ms: 2000
            response-timeout: 5s
            auth:
              required: true
              public-paths:
                - /system/ping
                - /auth/**
            # governance:
            #   flow-control:
            #     enabled: true
            #     count: 200
            #     interval-sec: 1
            #     burst: 50
            #     control-behavior: rate-limiter
            #     max-queueing-timeout-ms: 300
            #     param:
            #       enabled: true
            #       parse-strategy: header
            #       field-name: X-Tenant-Id
            #       pattern: vip-.*
            #       match-strategy: regex
          open:
            enabled: true
            api-enabled: true
            actuator-enabled: true
            path-segment: open
            service-uri: http://127.0.0.1:18080
            # api-methods:
            #   - GET
            # api-max-request-size: 2MB
            service-path-prefix: /open
            actuator-uri: http://127.0.0.1:18080
            connect-timeout-ms: 2000
            response-timeout: 5s
            auth:
              required: false
      # 未来新增项目时，直接在 projects 下追加，不再各自维护单独 gateway。
      # village-care:
      #   enabled: true
      #   path-segment: village-care
      #   display-name: Village Care
      #   routes:
      #     admin:
      #       enabled: true
      #       api-enabled: true
      #       actuator-enabled: true
      #       path-segment: admin
      #       service-uri: http://127.0.0.1:19080
      #       service-path-prefix: /admin
      #       actuator-uri: http://127.0.0.1:19080
      #       auth:
      #         required: true
      #         public-paths:
      #           - /system/ping
    health:
      path: /actuator/health
      timeout: 3s
